services:
  - type: web
    name: hashthakala-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # You will paste your MongoDB URI in the Render dashboard
      - key: JWT_SECRET
        sync: false # You will paste your JWT Secret in the Render dashboard
      - key: JWT_EXPIRE
        value: 30d
